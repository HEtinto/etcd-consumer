version: '3'

networks:
  etcd-net:
    driver: bridge

services:
  # ====================================
  # ETCD 集群
  # ====================================
  etcd0:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd0
    networks:
      - etcd-net
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=cluster1
      - ETCD_INITIAL_CLUSTER_STATE=new
    command: etcd

  etcd1:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd1
    networks:
      - etcd-net
    ports:
      - "2381:2379"
    environment:
      - ETCD_NAME=etcd1
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd1:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd1:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=cluster1
      - ETCD_INITIAL_CLUSTER_STATE=new
    command: etcd

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd2
    networks:
      - etcd-net
    ports:
      - "2383:2379"
    environment:
      - ETCD_NAME=etcd2
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd2:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd2:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=cluster1
      - ETCD_INITIAL_CLUSTER_STATE=new
    command: etcd

  # ====================================
  # 3 个消费者，一一对应
  # ====================================
  consumer0:
    image: golang:1.26-alpine
    container_name: go-consumer0
    networks:
      - etcd-net
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go mod init consumer || true && go get go.etcd.io/etcd/client/v3 && go run main.go etcd0:2379"
    depends_on:
      - etcd0

  consumer1:
    image: golang:1.26-alpine
    container_name: go-consumer1
    networks:
      - etcd-net
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go mod init consumer || true && go get go.etcd.io/etcd/client/v3 && go run main.go etcd1:2379"
    depends_on:
      - etcd1

  consumer2:
    image: golang:1.26-alpine
    container_name: go-consumer2
    networks:
      - etcd-net
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "go mod init consumer || true && go get go.etcd.io/etcd/client/v3 && go run main.go etcd2:2379"
    depends_on:
      - etcd2